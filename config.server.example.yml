# Configuration file for the Tunnel Server
#
# Copy this file to config.server.yml and fill in your values.
# config.server.yml is git-ignored and will never be committed.

# Address for the client control channel (TLS)
control_addr: ":7780"

# Address for public HTTP/HTTPS traffic
http_addr: ":80"

# Enable TLS for public traffic (HTTPS)
http_use_tls: true

# Base domain used to generate HTTP tunnel URLs
domain: "tunnel.example.com"

# Paths for the TLS certificate and key files.
tls_cert_file: "/etc/letsencrypt/live/example.com/fullchain.pem"
tls_key_file: "/etc/letsencrypt/live/example.com/privkey.pem"

# List of valid authentication tokens for clients.
# Generate strong random tokens (e.g., openssl rand -hex 32). The server refuses to
# start with an empty token, one shorter than 32 characters, or this placeholder.
valid_tokens:
  - "your-secret-token-here"

# Keepalive interval for the connection (e.g., 30s, 1m, 1h)
keepalive_interval: "30s"

# Write timeout for the connection (e.g., 10s, 1m)
connection_write_timeout: "30s"

# --- Resource limits (0 = unlimited / disabled) ---

# Max concurrent tunnels a single authenticated client may create.
max_tunnels_per_session: 100

# Max concurrent public connections per TCP tunnel.
max_conns_per_tunnel: 256

# Max concurrent control-channel connections (unauthenticated-flood protection).
max_control_connections: 512

# Per-source-address control-channel limits. max_control_connections above is a single
# global budget, so on its own it does not stop one peer from taking all of it: a control
# connection holds its slot for the whole session, and an unauthenticated one holds it
# for up to control_auth_timeout (below). IPv6 sources are grouped by /64, since a
# single peer is usually handed a whole /64.
#
# max_control_conns_per_ip caps concurrent connections per source. Raise it if many
# legitimate clients share one public address (a NAT'd office, a CI runner fleet).
max_control_conns_per_ip: 32

# Rate limit on new control connections per source: control_attempt_burst attempts
# back-to-back, then one more every control_attempt_interval. Legitimate clients only
# attempt on reconnect, so the burst is what absorbs a fleet restarting at once.
# Set either to 0 to disable the rate limit (the concurrency cap above still applies).
control_attempt_burst: 20
control_attempt_interval: "500ms"

# Max time for a new control connection to complete the TLS handshake and send a valid
# token. Each connection still in this window holds a control slot, so a short value
# makes the slots much harder to exhaust. Raise it only for clients on very slow or
# lossy links. Must be positive.
control_auth_timeout: "3s"

# Public HTTP server read/write timeouts. The built-in defaults (60s / 5m) harden
# against slow-body / slow-read clients; set "0s" for unlimited when your tunnels
# carry large uploads/downloads.
http_read_timeout: "60s"
http_write_timeout: "5m"

# Max time for the tunnel client to deliver the response headers of a proxied HTTP
# request. The response body is exempt and may stream without limit. Protects the
# server from stalled backends pinning goroutines/streams forever. "0s" = unlimited.
http_response_header_timeout: "30s"

# Max public HTTP request body size in bytes (0 = unlimited). Default: 100 MiB.
max_http_request_bytes: 104857600

# Max concurrent public requests/hijacked connections per HTTP tunnel (0 = unlimited).
max_http_conns_per_tunnel: 256

# Close WebSocket connections with no traffic in either direction, and SSE responses
# whose backend sends nothing, for this long. WebSocket ping/pong frames and SSE
# comments count as traffic. "0s" = unlimited.
hijacked_idle_timeout: "30m"

# --- Per-source limits on public traffic (0 = unlimited) ---
#
# The tunnel-wide limits above (max_http_conns_per_tunnel, max_conns_per_tunnel) are a
# single budget per tunnel: without these, one host could hold all of it and make the
# tunnel unreachable for everyone else. IPv6 sources are grouped by /64.
#
# IMPORTANT: these limits see the address the connection comes from. If the server sits
# behind a reverse proxy or load balancer, every visitor shares the proxy's address:
# set max_conns_per_ip_per_tunnel and max_public_conns_per_ip to 0 and enforce per-client
# limits on the proxy instead.

# Max concurrent requests (HTTP tunnels) or connections (TCP tunnels) per source on each
# tunnel. A browser keeps at most 6 requests in flight per host; raise this if many
# visitors of a tunnel share one public address (a NAT'd office).
max_conns_per_ip_per_tunnel: 32

# Close public TCP tunnel connections with no traffic in either direction for this long.
# Interactive protocols that stay silent for long periods (SSH without keepalives)
# need a higher value or client-side keepalives. "0s" = unlimited.
tcp_idle_timeout: "1h"

# Max connections open on the public HTTP listener, idle keep-alive ones included: in
# all (keep it well below the process's file descriptor limit) and per source.
max_public_conns: 10000
max_public_conns_per_ip: 256

# Additional subdomains clients may not claim (on top of the reserved
# www/admin/dashboard). Use this to keep sensitive names off the public domain.
reserved_subdomains:
  - "api"
  - "mail"

# --- Status Dashboard Configuration ---

# Address for the status dashboard. Leave empty to disable it.
# Without the TLS files below the dashboard is plain HTTP, and the server refuses to
# start unless it listens on loopback only (127.0.0.1, [::1] or localhost): reach it
# through an SSH tunnel (ssh -L 4040:127.0.0.1:4040 your-server) or a VPN. To listen
# on a public interface such as ":4040", configure dashboard TLS.
dashboard_addr: "127.0.0.1:4040"

# Credentials for dashboard Basic Auth. BOTH are REQUIRED whenever dashboard_addr is
# set, and the server refuses to start without them. The password must be at least
# 12 characters long and must not be this placeholder.
dashboard_username: "admin"
dashboard_password: "change-me"

# Dashboard auth throttling: lock a source out for dashboard_auth_lockout after
# this many failed Basic Auth attempts (0 = disabled).
dashboard_auth_max_failures: 5
dashboard_auth_lockout: "1m"

# (Optional) Paths for dashboard TLS files: set both or neither. If omitted, the
# dashboard uses HTTP (loopback only, see dashboard_addr). If not found, they will be
# automatically generated.
# dashboard_tls_cert_file: "/etc/letsencrypt/live/example.com/fullchain.pem"
# dashboard_tls_key_file: "/etc/letsencrypt/live/example.com/privkey.pem"
